# Mosquitto broker for Murmur nodes.
persistence true
persistence_location /mosquitto/data/
log_dest stdout
log_type error
log_type warning
log_type notice

listener 1883 0.0.0.0

# Anonymous access is convenient on a trusted home LAN.
# To require credentials instead (recommended):
#   docker compose exec mosquitto mosquitto_passwd -c -b /mosquitto/config/passwd murmur <password>
#   then set allow_anonymous false, uncomment password_file, and restart.
allow_anonymous true
#password_file /mosquitto/config/passwd
